{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-lg-6">
    <h1 class="h3">{{ titulo }}</h1>
    <p>¿Confirmas que deseas eliminar <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Eliminar</button>
        <a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancelar</a>
    </form>
</div></div>
{% endblock %}
