{% extends 'base.html' %}
{% block titulo %}Nueva solicitud de servicio{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-lg-7">
    <h1 class="h2 mb-3">Nueva solicitud de servicio</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}</div>{% endfor %}
        <button class="btn btn-primary" type="submit">Registrar solicitud</button>
        <a class="btn btn-outline-secondary" href="{% url 'solicitudes_lista' %}">Cancelar</a>
    </form>
</div></div>
{% endblock %}
