{% extends 'base.html' %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <h1 class="h3">Recuperar contraseña</h1>
    <p>Ingresa el correo asociado a tu cuenta para recibir un enlace de recuperación.</p>
    <form method="post">
        {% csrf_token %}
        <label class="form-label" for="id_email">Correo electrónico</label>
        <input class="form-control mb-3" type="email" name="email" id="id_email" required>
        <button class="btn btn-primary" type="submit">Enviar enlace</button>
    </form>
</div></div>
{% endblock %}
